[semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """chore(release-pipeline): {version}

Automatically generated by python-semantic-release"""
tag_format = "pipeline-v{version}"
allow_zero_version = true
major_on_zero = true

[semantic_release.branches.main]
match = "main"
prerelease = false

[semantic_release.commit_parser_options]
minor_tags = ["feat", "schema"]
patch_tags = ["fix", "perf", "build"]
other_allowed_tags = ["chore", "ci", "data", "docs", "refactor", "style", "test"]
allowed_tags = ["feat", "schema", "fix", "perf", "build", "chore", "ci", "data", "docs", "refactor", "style", "test"]
parse_squash_commits = true
ignore_merge_commits = true
path_filters = [
    "dagster/**",
    "!dagster/data/**",
    "scripts/**",
    "dvc.yaml",
    "params.yaml",
    "requirements*.txt",
    "pyproject.toml",
    "uv.lock",
    "poetry.lock",
]

[semantic_release.changelog]
mode = "update"
template_dir = "templates/pipeline_changelog"

[semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG_PIPELINE.md"
mask_initial_release = false
