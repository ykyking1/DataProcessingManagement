tab_pipeline:
  # Developer-provided local input; raw data is intentionally not DVC-tracked.
  input: local_data/dvc_repro/auair_sample.tab
  processed_output: tmp/dvc_repro/processed
  validation_report: reports/validation/dvc_repro_validation.json
  expected_row_count: 5
  expected_column_count: 17
  min_columns: 17
  max_columns: 100000
  timestamp_format: "yyyy-MM-dd'T'HH:mm:ss.SSS"
  zstd_level: 12
  result_format: BASIC
