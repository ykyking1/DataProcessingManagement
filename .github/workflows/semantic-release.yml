name: Data and Pipeline Releases

on:
  push:
    branches:
      - main
      - feat/minio-dvc-e2e-docker
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create semantic releases
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install semantic release tooling
        run: |
          python -m pip install --disable-pip-version-check \
            "python-semantic-release==10.6.1" \
            "GitPython==3.1.59"
          python -m pip check

      # Temporary compatibility pin: python-semantic-release 10.6.1 reads
      # Actor.name_email_regex, which GitPython removed in 3.1.60. Remove the
      # GitPython pin after the upstream PSR fix is released.
      - name: Configure release commit identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create pipeline changelog, tag, and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: >-
            github-actions[bot]
            <41898282+github-actions[bot]@users.noreply.github.com>
        run: |
          semantic-release -v --config releaserc-pipeline.toml version \
            --changelog \
            --commit \
            --tag \
            --push \
            --vcs-release \
            --skip-build

      - name: Create data changelog, tag, and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: >-
            github-actions[bot]
            <41898282+github-actions[bot]@users.noreply.github.com>
        run: |
          semantic-release -v --config releaserc-data.toml version \
            --changelog \
            --commit \
            --tag \
            --push \
            --vcs-release \
            --skip-build
