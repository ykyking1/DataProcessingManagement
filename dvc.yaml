stages:
  preprocess_auair:
    cmd: >-
      python scripts/preprocess_auair_tab_polars.py
      --input ${tab_pipeline.input}
      --output ${tab_pipeline.processed_output}
      --max-columns ${tab_pipeline.max_columns}
      --min-columns ${tab_pipeline.min_columns}
      --timestamp-format ${tab_pipeline.timestamp_format}
      --zstd-level ${tab_pipeline.zstd_level}
    deps:
      - scripts/preprocess_auair_tab_polars.py
      - requirements-repro.txt
      - ${tab_pipeline.input}
    params:
      - tab_pipeline.input
      - tab_pipeline.processed_output
      - tab_pipeline.max_columns
      - tab_pipeline.min_columns
      - tab_pipeline.timestamp_format
      - tab_pipeline.zstd_level
    outs:
      - ${tab_pipeline.processed_output}

  validate_auair:
    cmd: >-
      python scripts/validate_auair_tab_polars_ge.py
      --input ${tab_pipeline.processed_output}
      --report ${tab_pipeline.validation_report}
      --expected-row-count ${tab_pipeline.expected_row_count}
      --expected-column-count ${tab_pipeline.expected_column_count}
      --result-format ${tab_pipeline.result_format}
      --max-columns ${tab_pipeline.max_columns}
      --timestamp-format ${tab_pipeline.timestamp_format}
    deps:
      - scripts/preprocess_auair_tab_polars.py
      - scripts/validate_auair_tab_polars_ge.py
      - requirements-repro.txt
      - ${tab_pipeline.processed_output}
    params:
      - tab_pipeline.processed_output
      - tab_pipeline.validation_report
      - tab_pipeline.expected_row_count
      - tab_pipeline.expected_column_count
      - tab_pipeline.result_format
      - tab_pipeline.max_columns
      - tab_pipeline.timestamp_format
    metrics:
      - ${tab_pipeline.validation_report}:
          cache: false
